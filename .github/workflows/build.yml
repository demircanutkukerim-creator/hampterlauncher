name: Build Launcher EXE

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npx electron-builder --win
      - uses: actions/upload-artifact@v3
        with:
          name: HampterLauncher-EXE
          path: dist/*.exe
