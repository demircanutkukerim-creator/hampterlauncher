<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>HampterClient</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1e1e2f, #111119);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #ff9f43;
      text-shadow: 0px 4px 10px rgba(255, 159, 67, 0.4);
    }
    p {
      font-size: 1.2rem;
      color: #c8d6e5;
      margin-bottom: 30px;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px 40px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
      text-align: center;
    }
    .play-btn {
      background: #10ac84;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 15px 50px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(16, 172, 132, 0.4);
      transition: all 0.2s ease;
    }
    .play-btn:hover {
      background: #1dd1a1;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <h1>HAMPTER CLIENT</h1>
  <p>En İyi Minecraft Deneyimi</p>

  <div class="status-card">
    <span>Sunucu Adresi: <strong>oyna.hamptercinw.com</strong></span>
  </div>

  <button class="play-btn" onclick="alert('Minecraft Başlatılıyor... (Server: oyna.hamptercinw.com)')">OYUNA GİR</button>

</body>
</html>
